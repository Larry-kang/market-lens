<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Lens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="hero">
      <div class="hero__eyebrow">Market Lens</div>
      <h1>價格換算控制台</h1>
      <p id="currentSummary">目前標的：BTC-USD</p>
    </header>

    <section class="card">
      <label class="field-label" for="tickerInput">輸入標的</label>
      <div class="input-row">
        <input id="tickerInput" type="text" spellcheck="false" autocomplete="off" placeholder="BTC、QQQ、00713" maxlength="24">
        <button id="saveBtn" type="button" class="primary-btn">儲存</button>
      </div>
      <div class="hint" id="tickerHint">BTC → BTC-USD，00713 → 00713.TW</div>
      <div class="chip-grid" id="watchlist"></div>
    </section>

    <section class="card quote-card">
      <div class="quote-card__top">
        <div>
          <div class="field-label">轉換預覽</div>
          <div class="quote-preview" id="previewText">載入中…</div>
        </div>
        <button id="refreshBtn" type="button" class="secondary-btn">重新整理</button>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <span>顯示名稱</span>
          <strong id="displayName">—</strong>
        </div>
        <div class="metric">
          <span>現價</span>
          <strong id="priceText">—</strong>
        </div>
        <div class="metric">
          <span>更新時間</span>
          <strong id="updatedText">—</strong>
        </div>
        <div class="metric">
          <span>來源</span>
          <strong id="sourceText">—</strong>
        </div>
      </div>

      <div class="status" id="statusText">準備就緒</div>
    </section>

    <section class="card support-card">
      <div class="field-label">Support</div>
      <div class="support-card__copy">支持 Market Lens 的持續開發</div>
      <div class="support-card__actions">
        <a class="support-link support-link--primary" href="https://github.com/sponsors/Larry-kang" target="_blank" rel="noreferrer">GitHub Sponsors</a>
        <a class="support-link" href="https://github.com/Larry-kang/market-lens" target="_blank" rel="noreferrer">Project Page</a>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
